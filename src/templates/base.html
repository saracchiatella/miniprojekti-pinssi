<! doctype html>
<html>

<head>

    <link rel="stylesheet" href="/static/base.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>{{ title }}</title>

</head>

<body>
    <nav class=nav-pad>
        <a  href="{{ url_for('index') }}" class={% if request.endpoint == 'index' %}active{% endif %}>Etusivu</a> &nbsp;
        <a  href="{{ url_for('references') }}" class={% if request.endpoint == 'references' %}active{% endif %}>Kaikki lähdeviitteet</a> &nbsp;
        <a  href="{{ url_for('add_reference') }}" class="{% if request.endpoint in ['add_reference', 'book', 'article', 'inproceedings'] %}active{% endif %}">Uusi lähdeviite</a> &nbsp;
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>

</html>
