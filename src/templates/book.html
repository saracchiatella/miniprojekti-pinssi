{% extends "base.html" %}

{% block content %}

<h2>Lisää uusi kirjaviite</h2>

<p>Tähdellä * merkityt kohdat ovat pakollisia.</p>

<form action="{{ url_for('book') }}" method="post">

    <table>
        <tr>
            <td type="name">Tekijä:*</td>
            <td type="value">
                <input type="text" name="author" id="author" maxlength="100" required>
            </td>
        </tr>

        <tr>
            <td type="name">Toimittaja:</td>
            <td type="value">
                <input type="text" name="editor" id="editor" maxlength="100">
            </td>
        </tr>

        <tr>
            <td type="name">Kirjan nimi:*</td>
            <td type="value">
                <input type="text" name="title" id="title" maxlength="100" required>
            </td>
        </tr>

        <tr>
            <td type="name">Julkaisija:*</td>
            <td type="value">
                <input type="text" name="publisher" id="publisher" maxlength="100" required>
            </td>
        </tr>

        <tr>
            <td type="name">Julkaisuvuosi:*</td>
            <td type="value">
                <input type="text" name="year" id="year" required>
            </td>
        </tr>

        <tr>
            <td type="name">Osa:</td>
            <td type="value">
                <input type="text" name="volume" id="volume" maxlength="100">
            </td>
        </tr>

        <tr>
            <td type="name">Numero:</td>
            <td type="value">
                <input type="text" name="number" id="number">
            </td>
        </tr>

        <tr>
            <td type="name">Sivut:</td>
            <td type="value">
                <input type="text" name="pages" id="pages" maxlength="100">
            </td>
        </tr>

        <tr>
            <td type="name">Kuukausi:</td>
            <td type="value">
                <input type="text" name="month" id="month">
            </td>
        </tr>

        <tr>
            <td type="name">Lisätiedot:</td>
            <td type="value">
                <textarea name="note" id="note" rows="6" cols="50" maxlength="1000"></textarea>
            </td>
        </tr>

        <tr>
            <td type="name">DOI:</td>
            <td type="value">
                <input type="text" name="doi" id="doi" maxlength="100">
            </td>
        </tr>

        <tr>
            <td type="name">ISSN:</td>
            <td type="value">
                <input type="text" name="issn" id="issn">
            </td>
        </tr>

        <tr>
            <td type="name">ISBN:</td>
            <td type="value">
                <input type="text" name="isbn" id="isbn">
            </td>
        </tr>
    </table>

    <br>

    <button type="submit">
        Lisää viite
    </button>

</form>

<br><br>

<form action="{{ url_for('add_reference') }}">
    <button type="submit">
        Takaisin
    </button>
</form>

{% endblock %}
