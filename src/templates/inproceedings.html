
{% extends "base.html" %}

{% block content %}

<h2>Lisää uusi konferenssijulkaisuviite</h2>

<form action="{{ url_for('inproceedings') }}" method="post">

    <p>
        <label for="author">Tekijä:*</label>
        <input type="text" name="author" id="author" maxlength="100" required>
    </p>

    <p>
        <label for="title">Julkaisun nimi:*</label>
        <input type="text" name="title" id="title" maxlength="100" required>
    </p>

    <p>
        <label for="booktitle">Konferenssijulkaisun nimi:*</label>
        <input type="text" name="booktitle" id="booktitle" maxlength="100" required>
    </p>

    <p>
        <label for="year">Julkaisuvuosi:*</label>
        <input type="text" name="year" id="year" required>
    </p>

    <p>
        <label for="editor">Toimittaja:</label>
        <input type="text" name="editor" id="editor" maxlength="100">
    </p>

    <p>
        <label for="volume">Osa:</label>
        <input type="text" name="volume" id="volume" maxlength="100">
    </p>

    <p>
        <label for="number">Numero:</label>
        <input type="text" name="number" id="number">
    </p>

    <p>
        <label for="series">Sarja:</label>
        <input type="text" name="series" id="series" maxlength="100">
    </p>

    <p>
        <label for="pages">Sivut:</label>
        <input type="text" name="pages" id="pages" maxlength="100">
    </p>

    <p>
        <label for="month">Kuukausi:</label>
        <input type="text" name="month" id="month">
    </p>

    <p>
        <label for="address">Julkaisupaikka:</label>
        <input type="text" name="address" id="address" maxlength="100">
    </p>

    <p>
        <label for="organization">Organisaatio:</label>
        <input type="text" name="organization" id="organization" maxlength="100">
    </p>

    <p>
        <label for="publisher">Julkaisija:</label>
        <input type="text" name="publisher" id="publisher" maxlength="100">
    </p>

    <p>
        <label for="note">Lisätiedot:</label><br />
        <textarea name="note" id="note" rows="6" cols="50" maxlength="1000"></textarea>
    </p>

    <p>
        <label for="annote">Annotaatio:</label><br />
        <textarea name="annote" id="annote" rows="6" cols="50" maxlength="1000"></textarea>
    </p>

    <button type="submit">
        Lisää viite
    </button>

</form>

<br><br>

<form action="{{ url_for('add_reference') }}">
    <button type="submit">
        Takaisin
    </button>
</form>

{% endblock %}
